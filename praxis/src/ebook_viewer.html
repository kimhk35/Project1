<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
__FONTS__
<style>
/*__CSS__*/
:root{--stage:#0E1522;--chrome:#141D2E;--chrome-2:#1C2840;--chrome-ink:#E7E2D6;--chrome-mute:#8E99AE;--chrome-line:#27344F}
:root[data-theme="light"]{--stage:#D9D2C3;--chrome:#F4EFE5;--chrome-2:#E9E1D2;--chrome-ink:#16191F;--chrome-mute:#6B6F77;--chrome-line:#CFC5B2}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--stage:#D9D2C3;--chrome:#F4EFE5;--chrome-2:#E9E1D2;--chrome-ink:#16191F;--chrome-mute:#6B6F77;--chrome-line:#CFC5B2}}
html,body{height:100%;overflow:hidden}
body{background:var(--stage);font-family:var(--sans)}
.eb-top{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 14px;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid var(--chrome-line);z-index:30}
.eb-brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;white-space:nowrap}
.eb-brand small{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--chrome-mute);letter-spacing:.08em}
.eb-actions{display:flex;align-items:center;gap:6px}
.eb-btn{appearance:none;border:1px solid var(--chrome-line);background:var(--chrome-2);color:var(--chrome-ink);font:600 12.5px var(--sans);
  height:34px;min-width:34px;padding:0 11px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.eb-btn:hover{border-color:#E0735A}
.eb-btn:focus-visible{outline:2px solid #E0735A;outline-offset:2px}
.eb-ind{font:700 12.5px var(--sans);color:var(--chrome-mute);min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.eb-stage{position:fixed;top:52px;bottom:58px;left:0;right:0;overflow:hidden;touch-action:pan-y pinch-zoom}
.eb-stage.scroll{overflow-y:auto;overflow-x:hidden}
.eb-stage.zoomed{overflow:auto;touch-action:pan-x pan-y}
.eb-stage.zoomed .eb-book{cursor:grab}
.eb-stage.panning .eb-book{cursor:grabbing;user-select:none}
.eb-spacer{position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none}
.eb-zoom{display:flex;align-items:center;gap:4px;flex:none}
.eb-zoom .eb-btn{height:32px;min-width:32px;padding:0 8px;font-size:15px}
.eb-zoom .eb-zv{min-width:52px;font:700 12px var(--sans);color:var(--chrome-ink);text-align:center;font-variant-numeric:tabular-nums;background:none;border:0;cursor:pointer}
.eb-zoom .eb-fit{font-size:12px}
.eb-book{position:absolute;left:50%;top:50%;transform-origin:0 0;display:flex}
.eb-book .page{position:relative;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:opacity .35s ease, transform .35s ease}
.eb-book .page.hidden{display:none}
.eb-book.spread .page.left{box-shadow:-8px 10px 40px rgba(0,0,0,.35), inset -18px 0 24px -18px rgba(0,0,0,.28)}
.eb-book.spread .page.right{box-shadow:8px 10px 40px rgba(0,0,0,.35), inset 18px 0 24px -18px rgba(0,0,0,.28)}
.eb-book .page.enter-n{animation:inN .38s ease both}.eb-book .page.enter-p{animation:inP .38s ease both}
@keyframes inN{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.eb-book .page.enter-n,.eb-book .page.enter-p{animation:none}}
.eb-nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:72px;border:1px solid var(--chrome-line);background:var(--chrome);color:var(--chrome-ink);
  border-radius:8px;font-size:22px;cursor:pointer;z-index:20;opacity:.88}
.eb-nav:hover{opacity:1;border-color:#E0735A}
.eb-prev{left:10px}.eb-next{right:10px}
.eb-bottom{position:fixed;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--chrome);
  border-top:1px solid var(--chrome-line);color:var(--chrome-mute);z-index:30}
.eb-bottom input[type=range]{flex:1;accent-color:#C8412A}
.eb-sec{font:600 12px var(--sans);color:var(--chrome-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.eb-drawer{position:fixed;top:52px;bottom:58px;left:0;width:300px;max-width:86vw;background:var(--chrome);border-right:1px solid var(--chrome-line);
  transform:translateX(-102%);transition:transform .28s ease;z-index:40;overflow-y:auto;padding:14px 10px}
.eb-drawer.open{transform:none}
.eb-drawer h2{font:800 11px var(--sans);letter-spacing:.18em;color:#E0735A;margin:4px 8px 10px}
.eb-drawer ul{list-style:none}
.eb-drawer button{width:100%;display:flex;gap:12px;align-items:baseline;text-align:left;background:none;border:0;border-radius:6px;padding:9px 8px;
  color:var(--chrome-ink);font:500 14px var(--sans);cursor:pointer}
.eb-drawer button span{font-family:var(--display);font-weight:800;color:#E0735A;min-width:24px}
.eb-drawer button:hover,.eb-drawer button.cur{background:var(--chrome-2)}
.eb-help{font-size:11.5px;color:var(--chrome-mute);margin:14px 8px 0;line-height:1.6}
@media (max-width:700px){.eb-brand small,.eb-hide-s{display:none}.eb-nav{display:none}.eb-sec{display:none}}
.eb-tip{position:fixed;left:12px;right:12px;bottom:70px;z-index:35;background:var(--chrome);color:var(--chrome-ink);border:1px solid var(--chrome-line);border-radius:8px;padding:10px 12px;font:500 13px/1.5 var(--sans);display:none;gap:10px;align-items:center;justify-content:space-between}
.eb-tip a{color:#E0735A;font-weight:700}
.eb-tip button{background:none;border:0;color:var(--chrome-mute);font-size:18px;cursor:pointer}
@media (max-width:700px){.eb-tip.show{display:flex}}
</style>
</head>
<body>
<header class="eb-top">
  <div class="eb-brand">__BOOK__ PRAXIS <small>VOL 01 · 창간특집호</small></div>
  <div class="eb-actions">
    <button class="eb-btn" id="tocBtn" aria-expanded="false" aria-controls="drawer">차례</button>
    <span class="eb-ind" id="ind" aria-live="polite">1 / 34</span>
    <button class="eb-btn eb-hide-s" id="modeBtn" title="한 면 또는 펼침면">펼침면</button>
    <button class="eb-btn eb-hide-s" id="themeBtn" title="배경 밝기">배경</button>
    <button class="eb-btn" id="fsBtn" title="전체 화면">⤢</button>
    <a class="eb-btn eb-hide-s" href="__WEB__">웹판</a>
  </div>
</header>
<nav class="eb-drawer" id="drawer" aria-label="차례">
  <h2>CONTENTS</h2>
  <ul id="toc"><!--__TOC__--></ul>
  <p class="eb-help">← → 키 또는 스와이프로 넘긴다 페이지 좌우를 눌러도 된다 Home End 키로 처음과 끝으로 간다<br>확대 축소는 아래 − + 단추나 + − 0 키 Ctrl과 마우스 휠 두 손가락 벌리기로 한다 두 번 누르면 두 배로 확대된다 확대한 상태에서는 끌어서 옮겨 본다</p>
</nav>
<main class="eb-stage" id="stage">
  <div class="eb-spacer" id="spacer"></div><div class="eb-book" id="book"><!--__PAGES__--></div>
</main>
<button class="eb-nav eb-prev" id="prev" aria-label="이전 페이지">‹</button>
<button class="eb-nav eb-next" id="next" aria-label="다음 페이지">›</button>
<div class="eb-tip" id="tip"><span>작은 화면에서는 글자가 흐르는 <a href="__WEB__">웹판</a>이 더 읽기 편하다 좌우로 밀어 넘긴다</span><button id="tipX" aria-label="닫기">×</button></div>
<footer class="eb-bottom">
  <span class="eb-sec" id="sec">표지</span>
  <input type="range" id="range" min="1" max="34" value="1" aria-label="페이지 이동">
  <div class="eb-zoom" role="group" aria-label="확대 축소">
    <button class="eb-btn" id="zOut" title="축소 ( - )" aria-label="축소">−</button>
    <button class="eb-zv" id="zVal" title="100%로 되돌리기 ( 0 )">100%</button>
    <button class="eb-btn" id="zIn" title="확대 ( + )" aria-label="확대">+</button>
    <button class="eb-btn eb-fit" id="zFit" title="화면에 맞춤">맞춤</button>
  </div>
</footer>
<script>
(function(){
  var book=document.getElementById('book'),stage=document.getElementById('stage');
  var pages=[].slice.call(book.querySelectorAll('.page'));
  var N=pages.length,PW=793.7,PH=1122.5,cur=1,forced=null,dir=1;
  var zoom=1,ZMIN=.5,ZMAX=4,STEPS=[.5,.67,.8,1,1.25,1.5,2,2.5,3,4],lastScale=1;
  var spacer=document.getElementById('spacer'),zVal=document.getElementById('zVal'),zOut=document.getElementById('zOut'),zIn=document.getElementById('zIn');
  var ind=document.getElementById('ind'),range=document.getElementById('range'),sec=document.getElementById('sec');
  range.max=N;
  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function spreadMode(){
    if(forced) return forced==='spread';
    var w=stage.clientWidth,h=stage.clientHeight;return w/h>1.15&&w>900;
  }
  function spreadOf(n){ // cover alone, back alone when even count
    if(n<=1) return [1];
    if(n===N && N%2===0) return [N];
    var l=n%2===0?n:n-1;return [l,Math.min(l+1,N)];
  }
  function render(anim){
    var sp=spreadMode(),vis=sp?spreadOf(cur):[cur];
    book.classList.toggle('spread',sp&&vis.length===2);
    pages.forEach(function(p,i){
      var n=i+1,on=vis.indexOf(n)>-1;
      p.classList.toggle('hidden',!on);
      p.classList.remove('left','right','enter-n','enter-p');
      if(on&&vis.length===2){p.classList.add(n===vis[0]?'left':'right')}
      if(on&&anim){void p.offsetWidth;p.classList.add(dir>0?'enter-n':'enter-p')}
    });
    var w=PW*vis.length,sw=stage.clientWidth,sh=stage.clientHeight,pad=sw<700?8:36;
    var fitW=(sw-pad*2)/w,fitH=(sh-pad*2)/PH;
    var narrow=!sp&&sw<700,base=narrow?fitW:Math.min(fitW,fitH),s=base*zoom;
    var bw=w*s,bh=PH*s,over=bw+pad*2>sw+1||bh+pad*2>sh+1;
    stage.classList.toggle('zoomed',zoom>1.001&&over);
    stage.classList.toggle('scroll',!(zoom>1.001)&&narrow&&bh>sh);
    book.style.transform='scale('+s+')';
    book.style.left=Math.max(pad,(sw-bw)/2)+'px';
    book.style.top=(bh+pad*2>sh?pad:(sh-bh)/2)+'px';
    spacer.style.width=(bw+pad*2)+'px';spacer.style.height=(bh+pad*2)+'px';
    lastScale=s;
    zVal.textContent=Math.round(zoom*100)+'%';
    zOut.disabled=zoom<=ZMIN+1e-6;zIn.disabled=zoom>=ZMAX-1e-6;
    if(anim){stage.scrollTop=0;stage.scrollLeft=0}
    ind.textContent=(vis.length===2?vis[0]+'–'+vis[1]:vis[0])+' / '+N;
    range.value=cur;
    sec.textContent=pages[vis[vis.length-1]-1].getAttribute('data-title')||'';
    [].forEach.call(document.querySelectorAll('#toc button'),function(b){
      var g=+b.getAttribute('data-go');b.classList.toggle('cur',vis.indexOf(g)>-1);
    });
    document.getElementById('modeBtn').textContent=sp?'한 면':'펼침면';
    try{history.replaceState(null,'','#p='+cur)}catch(e){}
  }
  function setZoom(z,cx,cy){
    z=Math.max(ZMIN,Math.min(ZMAX,z));if(Math.abs(z-zoom)<1e-6)return;
    var r=stage.getBoundingClientRect();
    if(cx===undefined){cx=r.left+stage.clientWidth/2;cy=r.top+stage.clientHeight/2}
    var br=book.getBoundingClientRect(),old=lastScale;
    var bx=(cx-br.left)/old,by=(cy-br.top)/old;   // 확대 기준점의 책 좌표
    zoom=z;render(false);
    var nr=book.getBoundingClientRect();
    stage.scrollLeft+=(nr.left+bx*lastScale)-cx;
    stage.scrollTop+=(nr.top+by*lastScale)-cy;
  }
  function zoomStep(d,cx,cy){
    var i,t=zoom;
    if(d>0){for(i=0;i<STEPS.length;i++)if(STEPS[i]>zoom+1e-3){t=STEPS[i];break}}
    else{for(i=STEPS.length-1;i>=0;i--)if(STEPS[i]<zoom-1e-3){t=STEPS[i];break}}
    setZoom(t,cx,cy);
  }
  zIn.onclick=function(){zoomStep(1)};zOut.onclick=function(){zoomStep(-1)};
  zVal.onclick=function(){setZoom(1)};
  document.getElementById('zFit').onclick=function(){zoom=1;render(false);stage.scrollLeft=0;stage.scrollTop=0};
  stage.addEventListener('wheel',function(e){
    if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();
    setZoom(zoom*Math.exp(-e.deltaY*0.0022),e.clientX,e.clientY);
  },{passive:false});
  book.addEventListener('dblclick',function(e){e.preventDefault();clearTimeout(clickT);setZoom(zoom>1.01?1:2,e.clientX,e.clientY)});
  // 끌어서 옮기기
  var drag=null,moved=false,clickT=null;
  stage.addEventListener('pointerdown',function(e){
    if(!stage.classList.contains('zoomed')||e.pointerType==='touch'||e.button!==0)return;
    drag={x:e.clientX,y:e.clientY,l:stage.scrollLeft,t:stage.scrollTop};moved=false;
    stage.classList.add('panning');stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove',function(e){
    if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    stage.scrollLeft=drag.l-dx;stage.scrollTop=drag.t-dy;
  });
  function endDrag(){drag=null;stage.classList.remove('panning')}
  stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
  // 두 손가락 확대
  var pinch=null;
  stage.addEventListener('touchstart',function(e){
    if(e.touches.length===2){var a=e.touches[0],b=e.touches[1];
      pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom};sx=null}
  },{passive:true});
  stage.addEventListener('touchmove',function(e){
    if(!pinch||e.touches.length!==2)return;e.preventDefault();
    var a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    setZoom(pinch.z*d/pinch.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);
  },{passive:false});
  stage.addEventListener('touchend',function(e){if(e.touches.length<2)pinch=null},{passive:true});
  function go(n,anim){n=Math.max(1,Math.min(N,n));dir=n>=cur?1:-1;cur=n;render(anim!==false)}
  function step(d){
    if(spreadMode()){var v=spreadOf(cur);go(d>0?v[v.length-1]+1:v[0]-1)}else go(cur+d);
  }
  document.getElementById('prev').onclick=function(){step(-1)};
  document.getElementById('next').onclick=function(){step(1)};
  range.oninput=function(){go(+range.value)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();step(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
    else if(e.key==='Home'){go(1)}else if(e.key==='End'){go(N)}
    else if(e.key==='Escape'){toggleToc(false)}
    else if(e.key==='+'||e.key==='='){e.preventDefault();zoomStep(1)}
    else if(e.key==='-'||e.key==='_'){e.preventDefault();zoomStep(-1)}
    else if(e.key==='0'){e.preventDefault();setZoom(1)}
  });
  book.addEventListener('click',function(e){
    if(e.target.closest('a')) return;
    if(stage.classList.contains('zoomed')||moved){moved=false;return}
    if(e.detail>1){clearTimeout(clickT);return}
    var r=book.getBoundingClientRect(),d=e.clientX<r.left+r.width/2?-1:1;
    clearTimeout(clickT);clickT=setTimeout(function(){step(d)},260);
  });
  var sx=null,sy=null;
  stage.addEventListener('touchstart',function(e){if(e.touches.length!==1){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  stage.addEventListener('touchend',function(e){
    if(sx===null||stage.classList.contains('zoomed')||pinch)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){step(dx<0?1:-1)}sx=null;
  },{passive:true});
  var drawer=document.getElementById('drawer'),tocBtn=document.getElementById('tocBtn');
  function toggleToc(o){o=o===undefined?!drawer.classList.contains('open'):o;drawer.classList.toggle('open',o);tocBtn.setAttribute('aria-expanded',o)}
  tocBtn.onclick=function(){toggleToc()};
  drawer.addEventListener('click',function(e){var b=e.target.closest('button[data-go]');if(b){go(+b.getAttribute('data-go'));toggleToc(false)}});
  document.getElementById('modeBtn').onclick=function(){forced=spreadMode()?'single':'spread';store('praxis-mode',forced);render(false)};
  var root=document.documentElement,th=read('praxis-theme');if(th)root.setAttribute('data-theme',th);
  document.getElementById('themeBtn').onclick=function(){
    var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':!matchMedia('(prefers-color-scheme: light)').matches;
    var t=dark?'light':'dark';root.setAttribute('data-theme',t);store('praxis-theme',t);
  };
  document.getElementById('fsBtn').onclick=function(){
    if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){}).call(document.documentElement)}else{document.exitFullscreen()}
  };
  forced=read('praxis-mode');
  var tip=document.getElementById('tip');if(!read('praxis-tip'))tip.classList.add('show');
  document.getElementById('tipX').onclick=function(){tip.classList.remove('show');store('praxis-tip','1')};
  window.addEventListener('resize',function(){render(false)});
  var m=/p=(\d+)/.exec(location.hash);cur=m?Math.max(1,Math.min(N,+m[1])):1;
  render(false);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){render(false)})}
})();
</script>
</body>
</html>

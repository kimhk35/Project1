<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b9491c"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a55"/></marker></defs><rect width="1200" height="310" fill="#fcfcfb"/><text x="40.0" y="52.0" font-size="21" font-weight="700" fill="#1d1d1b" text-anchor="start">예시: 45분 수업에서 로그인·기기 연결에 5분이 걸린다면</text><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#eb6834"/><line x1="0" y1="0" x2="0" y2="10" stroke="#fff" stroke-width="3" opacity=".45"/></pattern></defs><rect x="60" y="100" width="118.0" height="70" rx="6" fill="url(#hatch)"/><rect x="180.0" y="100" width="960.0" height="70" rx="6" fill="#2a78d6" fill-opacity=".85"/><text x="200.0" y="144.0" font-size="20" font-weight="700" fill="#fff" text-anchor="start">실제 수업에 쓸 수 있는 시간 40분</text><path d="M120.0 180 V210" stroke="#b9491c" stroke-width="2"/><text x="60.0" y="236.0" font-size="18" font-weight="700" fill="#b9491c" text-anchor="start">로그인·기기 연결 5분</text><text x="60.0" y="262.1" font-size="18" font-weight="700" fill="#b9491c" text-anchor="start">수업 시간의 11% 이상</text><line x1="60.0" y1="92" x2="60.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="60.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">0</text><line x1="180.0" y1="92" x2="180.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="180.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">5</text><line x1="300.0" y1="92" x2="300.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="300.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">10</text><line x1="420.0" y1="92" x2="420.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="420.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">15</text><line x1="540.0" y1="92" x2="540.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="540.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">20</text><line x1="660.0" y1="92" x2="660.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="660.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">25</text><line x1="780.0" y1="92" x2="780.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="780.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">30</text><line x1="900.0" y1="92" x2="900.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="900.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">35</text><line x1="1020.0" y1="92" x2="1020.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="1020.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">40</text><line x1="1140.0" y1="92" x2="1140.0" y2="86" stroke="#8a8983" stroke-width="1.5"/><text x="1140.0" y="80.0" font-size="13" font-weight="500" fill="#8a8983" text-anchor="middle">45</text><text x="560.0" y="236.0" font-size="17" font-weight="500" fill="#52514e" text-anchor="start">스무 명이 넘는 학생이 서로 다른 화면에서 동시에 막히면</text><text x="560.0" y="261.5" font-size="17" font-weight="500" fill="#52514e" text-anchor="start">교사 한 명이 모두 해결하기 어렵습니다</text></svg>
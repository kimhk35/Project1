<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b9491c"/></marker><marker id="aht" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7a55"/></marker></defs><rect width="1200" height="560" fill="#fcfcfb"/><line x1="150" y1="470" x2="1080" y2="470" stroke="#52514e" stroke-width="2"/><line x1="150" y1="470" x2="150" y2="90" stroke="#52514e" stroke-width="2"/><line x1="150.0" y1="470" x2="150.0" y2="478" stroke="#52514e" stroke-width="2"/><text x="150.0" y="506.0" font-size="18" font-weight="500" fill="#52514e" text-anchor="middle">문제 정의</text><line x1="332.0" y1="470" x2="332.0" y2="478" stroke="#52514e" stroke-width="2"/><text x="332.0" y="506.0" font-size="18" font-weight="500" fill="#52514e" text-anchor="middle">기획</text><line x1="514.0" y1="470" x2="514.0" y2="478" stroke="#52514e" stroke-width="2"/><text x="514.0" y="506.0" font-size="18" font-weight="500" fill="#52514e" text-anchor="middle">설계</text><line x1="696.0" y1="470" x2="696.0" y2="478" stroke="#52514e" stroke-width="2"/><text x="696.0" y="506.0" font-size="18" font-weight="500" fill="#52514e" text-anchor="middle">개발</text><line x1="878.0" y1="470" x2="878.0" y2="478" stroke="#52514e" stroke-width="2"/><text x="878.0" y="506.0" font-size="18" font-weight="500" fill="#52514e" text-anchor="middle">출시 직전</text><line x1="1060.0" y1="470" x2="1060.0" y2="478" stroke="#52514e" stroke-width="2"/><text x="1060.0" y="506.0" font-size="18" font-weight="500" fill="#52514e" text-anchor="middle">출시 이후</text><text transform="translate(92 290.0) rotate(-90)" font-size="18" font-weight="600" fill="#52514e" text-anchor="middle">의견이 바꿀 수 있는 범위</text><text x="1080.0" y="540.0" font-size="16" font-weight="500" fill="#8a8983" text-anchor="end">참여 시점 →</text><path d="M150 120 C241 120 241 150 332 150 C423 150 423 230 514 230 C605 230 605 340 696 340 C787 340 787 410 878 410 C969 410 969 432 1060 432 L1060 470 L150 470 z" fill="#4a3aa7" fill-opacity=".08"/><path d="M150 120 C241 120 241 150 332 150 C423 150 423 230 514 230 C605 230 605 340 696 340 C787 340 787 410 878 410 C969 410 969 432 1060 432" fill="none" stroke="#4a3aa7" stroke-width="3"/><circle cx="150.0" cy="120" r="10" fill="#1baf7a" stroke="#fcfcfb" stroke-width="3"/><circle cx="878.0" cy="410" r="10" fill="#8a8983" stroke="#fcfcfb" stroke-width="3"/><text x="174.0" y="190.0" font-size="18" font-weight="600" fill="#1d1d1b" text-anchor="start">공동설계자로 참여</text><text x="174.0" y="216.1" font-size="18" font-weight="600" fill="#1d1d1b" text-anchor="start">무엇을 만들지 자체를 바꿀 수 있음</text><text x="878.0" y="220.0" font-size="18" font-weight="600" fill="#1d1d1b" text-anchor="middle">사용자로 의견 제시</text><text x="878.0" y="246.1" font-size="18" font-weight="600" fill="#1d1d1b" text-anchor="middle">버튼 위치를 바꾸는 데 그치기 쉬움</text><line x1="878.0" y1="262" x2="878.0" y2="396" stroke="#8a8983" stroke-width="1.5"/><text x="1070.0" y="362.0" font-size="15" font-weight="600" fill="#b9491c" text-anchor="end">사후 요구</text><text x="1070.0" y="382.2" font-size="15" font-weight="600" fill="#b9491c" text-anchor="end">(after-the-fact requirements)</text><text x="40.0" y="50.0" font-size="20" font-weight="700" fill="#1d1d1b" text-anchor="start">개념도: 참여 시점이 늦을수록 의견이 바꿀 수 있는 범위는 좁아진다</text><text x="1160.0" y="50.0" font-size="15" font-weight="500" fill="#8a8983" text-anchor="end">실측 데이터가 아닌 개념 모형</text></svg>
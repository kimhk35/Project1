<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="학생자치 전체 구조"><defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6474"/></marker><marker id="ah-del" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A56C6"/></marker><marker id="ah-raon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0643A"/></marker><marker id="ah-lead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A45C2"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15213B"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14866D"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4A26A"/></marker></defs><rect width="1000" height="640" fill="#fff"/><rect x="330" y="14" width="340" height="70" rx="14" fill="#fff" stroke="#15213B" stroke-width="2"/><text x="500" y="38" font-size="19" font-weight="800" fill="#15213B" text-anchor="middle" dominant-baseline="central" style="white-space:pre">학교</text><text x="500" y="64" font-size="14" font-weight="500" fill="#5B6474" text-anchor="middle" dominant-baseline="central" style="white-space:pre">교장, 교직원회의, 학교운영위원회</text><line x1="470" y1="86" x2="470" y2="126" stroke="#15213B" stroke-width=
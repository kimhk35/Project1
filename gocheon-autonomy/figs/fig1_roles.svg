<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Pretendard, 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="대의원회와 라온하제의 역할 구분"><defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6474"/></marker><marker id="ah-del" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A56C6"/></marker><marker id="ah-raon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E0643A"/></marker><marker id="ah-lead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A45C2"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15213B"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14866D"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4A26A"/></marker></defs><rect width="1000" height="600" fill="#fff"/><rect x="30" y="20" width="360" height="560" rx="20" fill="#fff" stroke="#2A56C6" stroke-width="2"/><path d="M30,40 a20,20 0 0 1 20,-20 h320 a20,20 0 0 1 20,20 v92 h-360 z" fill="#2A56C6"/><text x="210" y="58" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">대의원회</text><text x="210" y="94" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">목소리를 모아 결정한다</text><text x="210" y="118" font-size="12.5" font-weight="500" fill="#ffffffcc" text-anchor="middle" dominant-baseline="central">학교 속 의회</text><rect x="54" y="160" width="312" height="70" rx="12" fill="#E7EDFB" stroke="none" stroke-width="0"/><circle cx="92" cy="195" r="24" fill="#2A56C6"/><text x="92" y="195" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">대표</text><text x="130" y="195" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">학급이 뽑은 대표가 모인다</text><line x1="92" y1="220" x2="92" y2="256" stroke="#2A56C6" stroke-width="2" stroke-linecap="round"/><rect x="54" y="246" width="312" height="70" rx="12" fill="#E7EDFB" stroke="none" stroke-width="0"/><circle cx="92" cy="281" r="24" fill="#2A56C6"/><text x="92" y="281" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">심의</text><text x="130" y="281" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">안건을 따지고 토론한다</text><line x1="92" y1="306" x2="92" y2="342" stroke="#2A56C6" stroke-width="2" stroke-linecap="round"/><rect x="54" y="332" width="312" height="70" rx="12" fill="#E7EDFB" stroke="none" stroke-width="0"/><circle cx="92" cy="367" r="24" fill="#2A56C6"/><text x="92" y="367" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">의결</text><text x="130" y="367" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">전교생 사안을 결정한다</text><line x1="92" y1="392" x2="92" y2="428" stroke="#2A56C6" stroke-width="2" stroke-linecap="round"/><rect x="54" y="418" width="312" height="70" rx="12" fill="#E7EDFB" stroke="none" stroke-width="0"/><circle cx="92" cy="453" r="24" fill="#2A56C6"/><text x="92" y="453" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">평가</text><text x="130" y="453" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">실행 결과를 평가한다</text><rect x="54" y="510" width="312" height="50" rx="25" fill="none" stroke="#2A56C6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="210" y="535" font-size="15" font-weight="800" fill="#2A56C6" text-anchor="middle" dominant-baseline="central">핵심 질문  무엇을 할 것인가</text><rect x="610" y="20" width="360" height="560" rx="20" fill="#fff" stroke="#E0643A" stroke-width="2"/><path d="M610,40 a20,20 0 0 1 20,-20 h320 a20,20 0 0 1 20,20 v92 h-360 z" fill="#E0643A"/><text x="790" y="58" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">라온하제</text><text x="790" y="94" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">결정을 실행하고 만든다</text><text x="790" y="118" font-size="12.5" font-weight="500" fill="#ffffffcc" text-anchor="middle" dominant-baseline="central">학교 속 실행부</text><rect x="634" y="160" width="312" height="70" rx="12" fill="#FCEDE6" stroke="none" stroke-width="0"/><circle cx="672" cy="195" r="24" fill="#E0643A"/><text x="672" y="195" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">기획</text><text x="710" y="195" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">사업과 행사를 설계한다</text><line x1="672" y1="220" x2="672" y2="256" stroke="#E0643A" stroke-width="2" stroke-linecap="round"/><rect x="634" y="246" width="312" height="70" rx="12" fill="#FCEDE6" stroke="none" stroke-width="0"/><circle cx="672" cy="281" r="24" fill="#E0643A"/><text x="672" y="281" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">실행</text><text x="710" y="281" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">부서별로 실천한다</text><line x1="672" y1="306" x2="672" y2="342" stroke="#E0643A" stroke-width="2" stroke-linecap="round"/><rect x="634" y="332" width="312" height="70" rx="12" fill="#FCEDE6" stroke="none" stroke-width="0"/><circle cx="672" cy="367" r="24" fill="#E0643A"/><text x="672" y="367" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">홍보</text><text x="710" y="367" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">과정과 결과를 알린다</text><line x1="672" y1="392" x2="672" y2="428" stroke="#E0643A" stroke-width="2" stroke-linecap="round"/><rect x="634" y="418" width="312" height="70" rx="12" fill="#FCEDE6" stroke="none" stroke-width="0"/><circle cx="672" cy="453" r="24" fill="#E0643A"/><text x="672" y="453" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">보고</text><text x="710" y="453" font-size="15" font-weight="600" fill="#1F2937" text-anchor="start" dominant-baseline="central">결과를 대의원회에 보고한다</text><rect x="634" y="510" width="312" height="50" rx="25" fill="none" stroke="#E0643A" stroke-width="1.5" stroke-dasharray="4 4"/><text x="790" y="535" font-size="15" font-weight="800" fill="#E0643A" text-anchor="middle" dominant-baseline="central">핵심 질문  어떻게 실현할 것인가</text><line x1="402" y1="210" x2="596" y2="210" stroke="#2A56C6" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-del)"/><text x="499" y="190" font-size="13.5" font-weight="700" fill="#2A56C6" text-anchor="middle" dominant-baseline="central">의결 사항 · 사업 승인</text><line x1="598" y1="470" x2="404" y2="470" stroke="#E0643A" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-raon)"/><text x="501" y="492" font-size="13.5" font-weight="700" fill="#E0643A" text-anchor="middle" dominant-baseline="central">실행 결과 보고</text><circle cx="500" cy="340" r="84" fill="#6A45C2"/><circle cx="500" cy="340" r="92" fill="none" stroke="#6A45C2" stroke-width="1.5" stroke-dasharray="3 5"/><text x="500" y="312" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">학생회장단</text><text x="500" y="342" font-size="14" font-weight="600" fill="#EDE6FF" text-anchor="middle" dominant-baseline="central">의장 · 대표</text><text x="500" y="366" font-size="12.5" font-weight="500" fill="#EDE6FF" text-anchor="middle" dominant-baseline="central">양쪽 당연직</text></svg>
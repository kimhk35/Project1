<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55534e"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11766a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8553d"/></marker></defs><rect width="1200" height="500" fill="#f4efe6"/><rect x="0" y="0" width="10" height="500" fill="#11766a"/><text x="50.0" y="60.0" font-size="24" font-weight="800" fill="#1c1c20" text-anchor="start">머릿속의 목표는 답을 본 뒤 조용히 바뀝니다</text><line x1="150" y1="440" x2="1100" y2="440" stroke="#55534e" stroke-width="2" marker-end="url(#a)"/><line x1="560" y1="120" x2="560" y2="450" stroke="#1c1c20" stroke-width="2" stroke-dasharray="5 6"/><rect x="500" y="96" width="120" height="36" rx="18" fill="#1c1c20"/><text x="560.0" y="120.0" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">답을 받음</text><text x="150.0" y="470.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="start">답을 받기 전</text><text x="1100.0" y="470.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="end">답을 받은 뒤</text><text x="50.0" y="178.0" font-size="18" font-weight="800" fill="#11766a" text-anchor="start">종이 위</text><text x="50.0" y="348.0" font-size="18" font-weight="800" fill="#c8553d" text-anchor="start">머릿속</text><rect x="220" y="130" width="300" height="80" rx="14" fill="#fff" stroke="#11766a" stroke-width="2.5"/><text x="240.0" y="178.0" font-size="18" font-weight="700" fill="#1c1c20" text-anchor="start">x축과 만나는지 알아내기</text><rect x="760" y="130" width="300" height="80" rx="14" fill="#fff" stroke="#11766a" stroke-width="2.5"/><text x="780.0" y="178.0" font-size="18" font-weight="700" fill="#1c1c20" text-anchor="start">x축과 만나는지 알아내기</text><path d="M530 170 H750" stroke="#11766a" stroke-width="2.5" marker-end="url(#at)"/><text x="655.0" y="158.0" font-size="15" font-weight="700" fill="#11766a" text-anchor="middle">그대로 남음 → 대조 가능</text><rect x="220" y="300" width="300" height="80" rx="40" fill="#f5e1da" stroke="#c8553d" stroke-width="2" stroke-dasharray="7 6"/><text x="370.0" y="347.0" font-size="18" font-weight="600" fill="#55534e" text-anchor="middle">알아내려던 무언가…</text><rect x="760" y="300" width="300" height="80" rx="40" fill="#f5e1da" stroke="#c8553d" stroke-width="2"/><text x="910.0" y="347.0" font-size="19" font-weight="700" fill="#1c1c20" text-anchor="middle">x = −1 또는 x = 3</text><path d="M530 340 H750" stroke="#c8553d" stroke-width="2.5" marker-end="url(#ar)"/><text x="655.0" y="328.0" font-size="15" font-weight="700" fill="#c8553d" text-anchor="middle">답의 모양으로 바뀜</text><text x="910.0" y="410.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="middle">사후 확신 편향 (Fischhoff 1975)</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55534e"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11766a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8553d"/></marker></defs><rect width="1200" height="390" fill="#f4efe6"/><rect x="0" y="0" width="10" height="390" fill="#11766a"/><text x="50.0" y="60.0" font-size="24" font-weight="800" fill="#1c1c20" text-anchor="start">과제는 교사가 쓰고 목표는 학생이 씁니다</text><rect x="50" y="100" width="330" height="250" rx="14" fill="#fbf8f2" stroke="#d8d2c6" stroke-width="2"/><text x="80.0" y="145.0" font-size="22" font-weight="800" fill="#55534e" text-anchor="start">문제 · 과제</text><text x="80.0" y="172.0" font-size="16" font-weight="600" fill="#8d8a82" text-anchor="start">교사가 씁니다</text><rect x="80" y="200" width="260" height="10" rx="5" fill="#d8d2c6"/><rect x="80" y="226" width="220" height="10" rx="5" fill="#d8d2c6"/><rect x="80" y="252" width="250" height="10" rx="5" fill="#d8d2c6"/><rect x="80" y="278" width="180" height="10" rx="5" fill="#d8d2c6"/><text x="80.0" y="325.0" font-size="17" font-weight="600" fill="#55534e" text-anchor="start">무엇을 할지 주어진다</text><path d="M392 225 H458" stroke="#55534e" stroke-width="3" marker-end="url(#a)"/><text x="425.0" y="210.0" font-size="14" font-weight="600" fill="#8d8a82" text-anchor="middle">받아들임</text><rect x="470" y="100" width="330" height="250" rx="14" fill="#fff" stroke="#11766a" stroke-width="3"/><rect x="470" y="100" width="330" height="14" rx="7" fill="#11766a"/><text x="500.0" y="150.0" font-size="22" font-weight="800" fill="#11766a" text-anchor="start">목표 · 한 줄</text><text x="500.0" y="177.0" font-size="16" font-weight="600" fill="#8d8a82" text-anchor="start">학생이 씁니다</text><text x="500.0" y="222.0" font-size="19" font-weight="600" fill="#1c1c20" text-anchor="start">내가 이 문제에서</text><text x="500.0" y="249.6" font-size="19" font-weight="600" fill="#1c1c20" text-anchor="start">알아내려는 것은</text><path d="M500 290 q60 -14 120 0 t130 -4" stroke="#11766a" stroke-width="4" fill="none" stroke-linecap="round"/><text x="775.0" y="325.0" font-size="18" font-weight="600" fill="#1c1c20" text-anchor="end">이다</text><text x="850.0" y="140.0" font-size="20" font-weight="800" fill="#1c1c20" text-anchor="start">요건이 성립하는 두 조건</text><circle cx="864" cy="175" r="14" fill="#11766a"/><path d="M857 175 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="888.0" y="182.0" font-size="19" font-weight="700" fill="#1c1c20" text-anchor="start">자기 문장일 것</text><path d="M858 205 l12 12 M870 205 l-12 12" stroke="#c8553d" stroke-width="3" stroke-linecap="round"/><text x="888.0" y="218.0" font-size="15" font-weight="600" fill="#c8553d" text-anchor="start">문제를 그대로 옮겨 적으면 → 자기 문장이 아님</text><circle cx="864" cy="270" r="14" fill="#11766a"/><path d="M857 270 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="888.0" y="277.0" font-size="19" font-weight="700" fill="#1c1c20" text-anchor="start">답을 받기 전에 적혀 있을 것</text><path d="M858 300 l12 12 M870 300 l-12 12" stroke="#c8553d" stroke-width="3" stroke-linecap="round"/><text x="888.0" y="313.0" font-size="15" font-weight="600" fill="#c8553d" text-anchor="start">답을 본 뒤에 적으면 → 사후 정당화</text></svg>
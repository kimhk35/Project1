<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55534e"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11766a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8553d"/></marker></defs><rect width="1200" height="410" fill="#f4efe6"/><rect x="0" y="0" width="10" height="410" fill="#11766a"/><text x="50.0" y="60.0" font-size="24" font-weight="800" fill="#1c1c20" text-anchor="start">같은 빈자리가 시간을 따라 다른 모양으로 드러납니다</text><line x1="70" y1="150" x2="1150" y2="150" stroke="#55534e" stroke-width="2" marker-end="url(#a)"/><rect x="90" y="100" width="240" height="30" rx="15" fill="#fff" stroke="#1c1c20" stroke-width="1.5"/><text x="210.0" y="121.0" font-size="15" font-weight="700" fill="#1c1c20" text-anchor="middle">답을 받기 전</text><rect x="90.0" y="180" width="240.0" height="150" rx="14" fill="#fbf8f2" stroke="#d8d2c6" stroke-width="2"/><circle cx="120.0" cy="215" r="16" fill="#c8553d"/><text x="120.0" y="221.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="110.0" y="265.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">프롬프트가 문제의 복사본</text><rect x="360" y="100" width="500" height="30" rx="15" fill="#1c1c20" stroke="#1c1c20" stroke-width="1.5"/><text x="610.0" y="121.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">답을 받은 뒤</text><rect x="360.0" y="180" width="157.33333333333334" height="150" rx="14" fill="#fbf8f2" stroke="#d8d2c6" stroke-width="2"/><circle cx="390.0" cy="215" r="16" fill="#c8553d"/><text x="390.0" y="221.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="380.0" y="265.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">무엇을</text><text x="380.0" y="289.6" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">물었는지 다시</text><text x="380.0" y="314.3" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">확인</text><rect x="531.3333333333334" y="180" width="157.33333333333334" height="150" rx="14" fill="#fbf8f2" stroke="#d8d2c6" stroke-width="2"/><circle cx="561.3333333333334" cy="215" r="16" fill="#c8553d"/><text x="561.3" y="221.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="551.3" y="265.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">‘이거 맞아요?’</text><text x="551.3" y="289.6" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">판정을 넘김</text><rect x="702.6666666666667" y="180" width="157.33333333333334" height="150" rx="14" fill="#fbf8f2" stroke="#d8d2c6" stroke-width="2"/><circle cx="732.6666666666667" cy="215" r="16" fill="#c8553d"/><text x="732.7" y="221.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="722.7" y="265.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">어긋난 답을</text><text x="722.7" y="289.6" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">알아차리지</text><text x="722.7" y="314.3" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">못함</text><rect x="890" y="100" width="240" height="30" rx="15" fill="#fff" stroke="#1c1c20" stroke-width="1.5"/><text x="1010.0" y="121.0" font-size="15" font-weight="700" fill="#1c1c20" text-anchor="middle">과제를 마친 뒤</text><rect x="890.0" y="180" width="240.0" height="150" rx="14" fill="#fbf8f2" stroke="#d8d2c6" stroke-width="2"/><circle cx="920.0" cy="215" r="16" fill="#c8553d"/><text x="920.0" y="221.0" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="910.0" y="265.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">알게 된 것 대신 나온 답을</text><text x="910.0" y="289.6" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">말함</text><text x="600.0" y="380.0" font-size="18" font-weight="800" fill="#11766a" text-anchor="middle">둘 이상이 함께 보이면 목표 요건을 먼저 의심해 볼 것</text></svg>
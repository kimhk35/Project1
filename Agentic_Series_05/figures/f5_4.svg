<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55534e"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11766a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8553d"/></marker></defs><rect width="1200" height="450" fill="#f4efe6"/><rect x="0" y="0" width="10" height="450" fill="#11766a"/><text x="50.0" y="60.0" font-size="24" font-weight="800" fill="#1c1c20" text-anchor="start">효과적인 피드백이 답해야 하는 세 물음</text><text x="1150.0" y="60.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="end">Hattie &amp; Timperley 2007</text><rect x="60" y="110" width="330" height="150" rx="14" fill="#fff" stroke="#11766a" stroke-width="3"/><text x="84.0" y="152.0" font-size="18" font-weight="800" fill="#11766a" text-anchor="start">01</text><text x="84.0" y="196.0" font-size="23" font-weight="800" fill="#1c1c20" text-anchor="start">어디로 가고 있는가</text><text x="84.0" y="230.0" font-size="16" font-weight="600" fill="#55534e" text-anchor="start">목표 · 학생이 적은 한 줄</text><path d="M396 185 H424" stroke="#55534e" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="110" width="330" height="150" rx="14" fill="#fbf8f2" stroke="#55534e" stroke-width="2"/><text x="454.0" y="152.0" font-size="18" font-weight="800" fill="#55534e" text-anchor="start">02</text><text x="454.0" y="196.0" font-size="23" font-weight="800" fill="#1c1c20" text-anchor="start">어떻게 가고 있는가</text><text x="454.0" y="230.0" font-size="16" font-weight="600" fill="#55534e" text-anchor="start">지금의 수행을 목표에 비추기</text><path d="M766 185 H794" stroke="#55534e" stroke-width="3" marker-end="url(#a)"/><rect x="800" y="110" width="330" height="150" rx="14" fill="#fbf8f2" stroke="#55534e" stroke-width="2"/><text x="824.0" y="152.0" font-size="18" font-weight="800" fill="#55534e" text-anchor="start">03</text><text x="824.0" y="196.0" font-size="23" font-weight="800" fill="#1c1c20" text-anchor="start">다음은 어디인가</text><text x="824.0" y="230.0" font-size="16" font-weight="600" fill="#55534e" text-anchor="start">차이를 줄이는 다음 행동</text><rect x="60" y="300" width="1070" height="120" rx="14" fill="#fbf8f2" stroke="#d8d2c6" stroke-width="2"/><text x="90.0" y="345.0" font-size="19" font-weight="800" fill="#c8553d" text-anchor="start">첫 번째가 비면</text><text x="90.0" y="378.0" font-size="17" font-weight="600" fill="#55534e" text-anchor="start">목적지를 모르는 사람에게 잘 가고 있다거나 방향이 틀렸다고 말해 줄 수 없습니다</text><text x="90.0" y="404.4" font-size="17" font-weight="600" fill="#55534e" text-anchor="start">교사는 자기 기준으로만 말하게 되고 피드백은 채점이 됩니다</text><rect x="760" y="318" width="340" height="84" rx="12" fill="#fff" stroke="#11766a" stroke-width="2"/><text x="782.0" y="352.0" font-size="16" font-weight="700" fill="#11766a" text-anchor="start">너는 이걸 알아내려 했는데</text><text x="782.0" y="376.0" font-size="16" font-weight="700" fill="#11766a" text-anchor="start">지금 나온 건 이거네 → 평가가 아니라 대조</text></svg>
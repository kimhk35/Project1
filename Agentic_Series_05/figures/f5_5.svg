<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55534e"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11766a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8553d"/></marker></defs><rect width="1200" height="500" fill="#f4efe6"/><rect x="0" y="0" width="10" height="500" fill="#11766a"/><text x="50.0" y="60.0" font-size="24" font-weight="800" fill="#1c1c20" text-anchor="start">한 학생의 한 줄이 넉 달 동안 바뀐 과정</text><rect x="50" y="330" width="265" height="110" rx="12" fill="#fbf8f2" stroke="#8d8a82" stroke-width="2"/><text x="70.0" y="366.0" font-size="22" font-weight="800" fill="#1c1c20" text-anchor="start">3월</text><text x="70.0" y="394.0" font-size="17" font-weight="700" fill="#1c1c20" text-anchor="start">1단계 옮겨 적기</text><text x="182.5" y="272.0" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">‘이차방정식의 해를 구하는 것’</text><text x="182.5" y="294.5" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">문제에 적힌 그대로</text><rect x="330" y="268" width="265" height="172" rx="12" fill="#fbf8f2" stroke="#8d8a82" stroke-width="2"/><text x="350.0" y="304.0" font-size="22" font-weight="800" fill="#1c1c20" text-anchor="start">4월</text><text x="350.0" y="332.0" font-size="17" font-weight="700" fill="#1c1c20" text-anchor="start">2단계 바꿔 말하기</text><text x="462.5" y="210.0" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">‘x가 몇인지 찾는 것’</text><text x="462.5" y="232.5" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">자기 말이지만 번역에 가까움</text><rect x="610" y="206" width="265" height="234" rx="12" fill="#fff" stroke="#11766a" stroke-width="2"/><text x="630.0" y="242.0" font-size="22" font-weight="800" fill="#11766a" text-anchor="start">5월</text><text x="630.0" y="270.0" font-size="17" font-weight="700" fill="#1c1c20" text-anchor="start">3단계 이유 붙이기</text><text x="742.5" y="148.0" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">‘x축이랑 만나는지 알려면</text><text x="742.5" y="170.5" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">해가 있는지부터 봐야 함’</text><rect x="890" y="144" width="265" height="296" rx="12" fill="#dcebe7" stroke="#11766a" stroke-width="3"/><text x="910.0" y="180.0" font-size="22" font-weight="800" fill="#11766a" text-anchor="start">6월</text><text x="910.0" y="208.0" font-size="17" font-weight="700" fill="#1c1c20" text-anchor="start">4단계 구분하기</text><text x="1022.5" y="86.0" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">‘해를 구하라는데 나는</text><text x="1022.5" y="108.5" font-size="15.5" font-weight="600" fill="#55534e" text-anchor="middle">몇 개인지만 알면 될 것 같음’</text><text x="50.0" y="480.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="start">1·2단계  표면의 소재와 직접 번역에 머묾</text><text x="620.0" y="480.0" font-size="15" font-weight="700" fill="#11766a" text-anchor="start">3단계  문제의 구조가 문장 안으로   4단계  통제가 문장으로</text></svg>
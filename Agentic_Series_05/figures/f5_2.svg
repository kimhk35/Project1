<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55534e"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#11766a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8553d"/></marker></defs><rect width="1200" height="490" fill="#f4efe6"/><rect x="0" y="0" width="10" height="490" fill="#11766a"/><text x="50.0" y="60.0" font-size="24" font-weight="800" fill="#1c1c20" text-anchor="start">같은 문제를 읽고도 서로 다른 것을 봅니다</text><rect x="50" y="100" width="350" height="300" rx="14" fill="#fbf8f2" stroke="#c8553d" stroke-width="2"/><text x="76.0" y="148.0" font-size="24" font-weight="800" fill="#c8553d" text-anchor="start">통째로 붙여 넣기</text><text x="76.0" y="176.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="start">고르는 일도 건너뜀</text><rect x="76" y="200" width="280" height="8" rx="4" fill="#d8d2c6"/><rect x="76" y="218" width="250" height="8" rx="4" fill="#d8d2c6"/><rect x="76" y="236" width="270" height="8" rx="4" fill="#d8d2c6"/><rect x="76" y="254" width="200" height="8" rx="4" fill="#d8d2c6"/><path d="M76 195 h290 v76 h-290 z" fill="none" stroke="#c8553d" stroke-width="2" stroke-dasharray="6 5"/><text x="76.0" y="315.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">문장 전체를 그대로 넘김</text><text x="76.0" y="339.6" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">+ 풀어 줘</text><text x="76.0" y="382.0" font-size="13.5" font-weight="600" fill="#8d8a82" text-anchor="start">상황 모형이 어디에서도 세워지지 않을 수 있음</text><rect x="425" y="100" width="350" height="300" rx="14" fill="#fbf8f2" stroke="#8d8a82" stroke-width="2"/><text x="451.0" y="148.0" font-size="24" font-weight="800" fill="#1c1c20" text-anchor="start">직접 번역</text><text x="451.0" y="176.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="start">Hegarty 등 1995</text><rect x="451" y="218" width="48" height="12" rx="6" fill="#d8d2c6"/><rect x="507" y="218" width="30" height="12" rx="6" fill="#8d8a82"/><rect x="545" y="218" width="56" height="12" rx="6" fill="#d8d2c6"/><rect x="609" y="218" width="26" height="12" rx="6" fill="#8d8a82"/><rect x="643" y="218" width="40" height="12" rx="6" fill="#d8d2c6"/><rect x="691" y="218" width="36" height="12" rx="6" fill="#8d8a82"/><text x="451.0" y="260.0" font-size="17" font-weight="700" fill="#55534e" text-anchor="start">3 · 더 · 5 → 3 + 5</text><text x="451.0" y="315.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">숫자와 ‘더’ ‘적게’ 같은</text><text x="451.0" y="339.6" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">핵심어를 골라 곧바로 연산</text><text x="451.0" y="382.0" font-size="13.5" font-weight="600" fill="#8d8a82" text-anchor="start">초보자는 표면의 소재로 묶음 (Chi 등 1981)</text><rect x="800" y="100" width="350" height="300" rx="14" fill="#fff" stroke="#11766a" stroke-width="3"/><text x="826.0" y="148.0" font-size="24" font-weight="800" fill="#11766a" text-anchor="start">상황 모형</text><text x="826.0" y="176.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="start">잘 푸는 학생 · 전문가</text><circle cx="870" cy="235" r="22" fill="#dcebe7" stroke="#11766a" stroke-width="2"/><circle cx="975" cy="220" r="18" fill="#dcebe7" stroke="#11766a" stroke-width="2"/><circle cx="1070" cy="245" r="20" fill="#dcebe7" stroke="#11766a" stroke-width="2"/><path d="M892 230 L957 222 M993 224 L1050 240" stroke="#11766a" stroke-width="2"/><text x="826.0" y="315.0" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">문장이 묘사하는 상황을</text><text x="826.0" y="339.6" font-size="17" font-weight="600" fill="#1c1c20" text-anchor="start">먼저 세우고 식을 끌어냄</text><text x="826.0" y="382.0" font-size="13.5" font-weight="600" fill="#8d8a82" text-anchor="start">전문가는 적용 원리로 묶음 (Chi 등 1981)</text><path d="M60 440 H1140" stroke="#d8d2c6" stroke-width="3"/><path d="M60 440 H1140" stroke="#11766a" stroke-width="3" stroke-dasharray="0" opacity=".0"/><path d="M1060 440 H1140" stroke="#11766a" stroke-width="3" marker-end="url(#at)"/><text x="60.0" y="470.0" font-size="15" font-weight="600" fill="#8d8a82" text-anchor="start">문제 표상이 세워지는 정도</text><text x="1140.0" y="470.0" font-size="15" font-weight="700" fill="#11766a" text-anchor="end">더 깊이</text></svg>